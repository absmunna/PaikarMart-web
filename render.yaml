# ==============================================================================
# PAIKAR MART - RENDER BLUEPRINT CONFIGURATION (render.yaml)
# Auto-deployment for Backend API on Render connected to GitHub
# ==============================================================================
services:
  - type: web
    name: paikarmart-backend
    runtime: node
    plan: free # Note: This is the plan tier name on Render
    region: singapore
    autoDeploy: true
    branch: main
    # pnpm দিয়ে সঠিক উপায়ে ডাটাবেজ প্রিজমা জেনারেট এবং শুধুমাত্র ব্যাকএন্ড অ্যাপটি বিল্ড করার জন্য:
    buildCommand: sh diagnose-build.sh && npm install && cd packages/database && npx prisma generate && cd ../../apps/frontend && npm run build && cd ../backend && npm run build
    # রান করার আগে dist/server.js সঠিকভাবে তৈরি হয়েছে কিনা তা চেক করে রান করবে:
    startCommand: sh -c "if [ -f apps/backend/dist/server.js ]; then node --no-deprecation apps/backend/dist/server.js; else echo 'Error: dist/server.js not found' && exit 1; fi"
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard: Supabase PostgreSQL Connection String
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a secure 32+ character key
      - key: CLIENT_URL
        sync: false # Set in Render Dashboard: your Vercel deployment URL
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false # Optional: Google Gemini API key for AI features
