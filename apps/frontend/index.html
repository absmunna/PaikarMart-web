    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        function isViteWsNoise(text) {
          return (
            text.indexOf('@vite/client') !== -1 ||
            text.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            text.indexOf('WebSocket closed without opened') !== -1
          );
        }
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var text =
              ((reason && reason.message) || '') +
              ' ' +
              ((reason && reason.stack) || '') +
              ' ' +
              String(reason || '');
            if (isViteWsNoise(text)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'error',
          function (event) {
            var targetIsWs = typeof WebSocket !== 'undefined' && event.target instanceof WebSocket;
            var text =
              (event.message || '') +
              ' ' +
              (event.filename || '') +
              ' ' +
              ((event.error && event.error.stack) || '');
            if (targetIsWs || isViteWsNoise(text)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
