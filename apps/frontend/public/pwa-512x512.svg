<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="pwa-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9100" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <!-- Squircle Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#pwa-bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" />
  
  <!-- Modern Shopping Bag / Paikar Mart Emblem -->
  <g transform="translate(106, 96)">
    <!-- Bag Handle -->
    <path d="M75 140 C75 50, 225 50, 225 140" fill="none" stroke="url(#pwa-accent)" stroke-width="26" stroke-linecap="round" />
    
    <!-- Bag Body -->
    <path d="M25 140 L275 140 L255 310 C252 330, 235 345, 215 345 L85 345 C65 345, 48 330, 45 310 Z" fill="url(#pwa-accent)" />
    
    <!-- Accent Stitch / Diamond Motif -->
    <path d="M150 190 L180 230 L150 270 L120 230 Z" fill="#ffffff" opacity="0.95" />
    <circle cx="150" cy="230" r="14" fill="#18181b" />
  </g>
</svg>
