<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>অফলাইন মোড - পাইকার মার্ট (Paikar Mart)</title>
  <meta name="theme-color" content="#09090b" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #09090b;
      color: #f4f4f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #18181b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
      padding: 2.25rem 1.75rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: rgba(249, 115, 22, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f97316;
    }
    .icon-wrapper svg {
      width: 38px;
      height: 38px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #a1a1aa;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 0.75rem;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover {
      opacity: 0.95;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn svg {
      width: 18px;
      height: 18px;
    }
    .footer-note {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: #71717a;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>ইন্টারনেট সংযোগ বিচ্ছিন্ন</h1>
    <p class="subtitle">
      আপনার ডিভাইস বর্তমানে অফলাইনে রয়েছে। পূর্বে লোড হওয়া পেজ এবং ক্যাশ করা কনটেন্ট দেখা যাবে। ইন্টারনেট চালু হলে পুনরায় চেষ্টা করুন।
    </p>
    <button class="btn" onclick="window.location.reload()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      পুনরায় চেষ্টা করুন (Retry)
    </button>
    <p class="footer-note">পাইকার মার্ট (Paikar Mart) • প্রগ্রেসিভ ওয়েব অ্যাপ</p>
  </div>
</body>
</html>
