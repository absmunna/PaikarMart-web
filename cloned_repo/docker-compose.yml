version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service (Local development matching Supabase Postgres)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: paikarmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: paikarmart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paikarmart"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Paikar Mart Backend API Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paikarmart-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:10000"
    environment:
      NODE_ENV: development
      PORT: 10000
      DATABASE_URL: postgresql://postgres:postgres_dev_password@postgres:5432/paikarmart?schema=public
      DIRECT_URL: postgresql://postgres:postgres_dev_password@postgres:5432/paikarmart?schema=public
      JWT_SECRET: paikarmart_dev_local_docker_secret_minimum_32_characters
      CLIENT_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000
      ALLOW_NO_FIREBASE: "true"
      SUPABASE_STORAGE_PUBLIC_BUCKET: public-media
      SUPABASE_STORAGE_PRIVATE_BUCKET: digital-products

volumes:
  postgres_data:
    driver: local
